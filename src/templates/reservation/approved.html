<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rezerwacja zaakceptowana</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#16a34a;padding:20px 24px;">

                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;color:#27272a;font-size:14px;line-height:1.6;">

                        <p>
                            Termin odbioru: <strong>{{START_DATE}}</strong><br>
                            Termin zwrotu: <strong>{{END_DATE}}</strong>

                        <p>Sprzęt można odebrać w sekretariacie od dnia rozpoczęcia rezerwacji.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 24px;background-color:#fafafa;color:#a1a1aa;font-size:12px;">
                        wypożyczSANie - System Rezerwacji Sprzętu
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
